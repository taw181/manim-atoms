[project]
name = "manim-atoms"
version = "0.1.0"
description = "Manim animations of atomic physics: atom interferometry, laser cooling and trapping, AION science, and a manim-slides deck layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.1",
    "manim>=0.21.0",
]

[project.optional-dependencies]
slides = ["manim-slides[pyside6]>=5.7.0"]
plots = ["matplotlib>=3.11.2"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "manim_atoms"
